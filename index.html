</head>


<body>


<!-- ================= HEADER ================= -->

<header class="site-header">

    <div class="container">

        <div class="header-inner">


            <!-- LOGO -->

            <a
                href="index.html"
                class="logo"
            >
                БАРБЕР
                <span>ШТАБ</span>
            </a>


            <!-- NAVIGATION -->

            <nav
                class="main-nav"
                id="nav"
            >

                <a
                    href="index.html"
                    class="active"
                >
                    Головна
                </a>

                <a href="about.html">
                    Про нас
                </a>

                <a href="services.html">
                    Послуги
                </a>

                <a href="masters.html">
                    Майстри
                </a>

                <a href="works.html">
                    Роботи
                </a>

                <a href="reviews.html">
                    Відгуки
                </a>

                <a href="contact.html">
                    Контакти
                </a>

            </nav>


            <!-- PHONE -->

            <a
                href="tel:+380970048424"
                class="header-button"
            >
                Записатися
            </a>


            <!-- MOBILE MENU -->

            <button
                class="menu-button"
                id="menuButton"
                aria-label="Відкрити меню"
            >

                <span></span>
                <span></span>
                <span></span>

            </button>


        </div>

    </div>

</header>



<!-- ================= MAIN ================= -->

<main>


    <!-- ================= HERO ================= -->

    <section class="hero">

        <div class="container">

            <div class="hero-grid">


                <!-- TEXT -->

                <div class="hero-content">


                    <div class="hero-badge">

                        <span></span>

                        БАРБЕРШОП У ЛУЦЬКУ

                    </div>


                    <h1>

                        Стиль,
                        <br>

                        <span>який говорить</span>

                        <br>

                        за тебе.

                    </h1>


                    <p>

                        Барбер Штаб — сучасний простір
                        чоловічого стилю, де кожна деталь
                        створена для тебе.

                    </p>


                    <div class="hero-buttons">


                        <a
                            href="contact.html"
                            class="button-primary"
                        >

                            Записатися

                            <span>→</span>

                        </a>


                        <a
                            href="services.html"
                            class="button-secondary"
                        >

                            Переглянути послуги

                        </a>


                    </div>


                </div>



                <!-- IMAGE -->

                <div class="hero-media">

                    <div class="hero-image-wrapper">

                        <img
                            src="images/hero-barber.jpg"
                            alt="Барбер Штаб"
                            class="hero-image"
                        >

                    </div>


                    <div class="hero-badge hero-badge-floating">

                        <strong>5.0</strong>

                        <span>★★★★★</span>

                        <small>
                            500+ відгуків
                        </small>

                    </div>

                </div>


            </div>

        </div>

    </section>

<script src="script.js"></script>
